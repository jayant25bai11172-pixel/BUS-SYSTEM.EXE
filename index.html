<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitTrack - Login</title>
    <!-- We use this link to get Tailwind CSS styling without installing anything -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4">

    <!-- Login Card -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-blue-600 mb-2">TransitTrack</h1>
            <p class="text-gray-500 font-medium">Select your role to continue</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <!-- Role Selection -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">I am a...</label>
                <select id="userRole" class="w-full p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 focus:outline-none transition-all text-gray-700 font-medium bg-gray-50" required>
                    <option value="" disabled selected>Select your portal</option>
                    <option value="student">Student / Parent</option>
                    <option value="conductor">Bus Conductor</option>
                    <option value="driver">Bus Driver</option>
                </select>
            </div>

            <!-- Login Button -->
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 shadow-lg hover:shadow-xl transition-all">
                Enter Portal
            </button>
        </form>
    </div>

    <!-- Simple Javascript to route the user -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Stops the page from refreshing
            
            const role = document.getElementById('userRole').value;
            
            if (role === 'student') {
                window.location.href = 'map.html';
            } else if (role === 'conductor') {
                window.location.href = 'conductor.html';
            } else if (role === 'driver') {
                window.location.href = 'driver.html';
            }
        });
    </script>

</body>
</html>
