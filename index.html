<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitTrack - Login</title>
    <!-- Pulling in Tailwind CSS without needing to install anything -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">TransitTrack</h1>
            <p class="text-gray-500">Select your role to continue</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">I am a...</label>
                <select id="userRole" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="" disabled selected>Select your portal</option>
                    <option value="student">Student / Parent</option>
                    <option value="conductor">Bus Conductor</option>
                    <option value="driver">Bus Driver</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Access PIN (Optional for now)</label>
                <input type="password" placeholder="Enter PIN" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors">
                Login
            </button>
        </form>
    </div>

    <script>
        // Simple routing logic using Vanilla JavaScript
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page reload
            
            const role = document.getElementById('userRole').value;
            
            if (role === 'student') {
                window.location.href = 'map.html';
            } else if (role === 'conductor') {
                window.location.href = 'conductor.html';
            } else if (role === 'driver') {
                window.location.href = 'driver.html';
            } else {
                alert('Please select a role first!');
            }
        });
    </script>
</body>
</html>
